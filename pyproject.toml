[project]
name = "communication-diagnosis"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2,<3",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
